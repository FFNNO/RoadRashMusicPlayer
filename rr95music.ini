; rr95music.ini - settings for the standalone Road Rash 95 music mod (dsound.dll).
; This file belongs next to RoadRash95.exe. The music mod has its own log: rr95music.log.
; It never reads rr95gpu.ini or writes rr95gpu.log.

[Music]
; 1 = load the player. It installs its own hooks on the game code (the standalone mode).
; 0 = forward DirectSound calls only: no hooks.
Enabled=1

; EXPERIMENTAL. 0 = standalone (default, recommended): a game routine another mod already patched is
; left alone, and that part of the player stays off.
; 1 = work alongside other mods: chain onto hooks other mods already installed on the same game
; routines (tested with Road Rash FFNNO Patch v0.1.3). Music and hotkeys are expected to work; the
; beeper and the Reproductor row may be unavailable next to a GPU mod. If the other mod removes or
; changes its hooks, the player can lose them, and a crash is possible. Set 0 to turn it off.
OtherModsCompat=0

; debug, info, warn or error. Anything else uses info.
LogLevel=info

; Folder with your own cassettes, relative to the game folder (absolute paths are kept as they are).
; The mod creates it on startup when it is missing. Loose files at the root form the "music"
; cassette; one subfolder is one cassette. .wav, .mp3, .ogg and .flac are read.
Path=music

; 1 = shuffle the tracks of every cassette; 0 = play them in name order.
Shuffle=0

; 0..100. Values outside the range clamp; a non-number keeps 80.
Volume=80

; The game also writes a valid choice to
; HKCU\SOFTWARE\Electronic Arts\RoadRash 95\ModMusicCassette and ModMusicKeys, and a valid
; registry value wins over these keys at startup.

; Music hotkeys. Syntax: Ctrl+Shift+Alt+Key; modifiers are optional and may come in any order.
; The defaults are keys the game does not bind. A music hotkey that equals the general mod's
; ToggleKey (ScrollLock when rr95gpu.ini is missing) is disabled.
NextKey=PageDown
PrevKey=PageUp
PlayPauseKey=End
NextCassetteKey=Insert

; The overlay hotkey shows or hides the beeper for the current race without changing Overlay.
OverlayKey=Home

; Player on-screen overlay: ondemand or pinned; placement: bottomleft, topleft, bottomright,
; topright. Overlay is also stored in HKCU\...\RoadRash 95\ModMusicOverlay once you change it in
; the Reproductor popup, and a valid registry value wins over this key.
Overlay=ondemand
Corner=bottomleft
